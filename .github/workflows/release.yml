# Push a tag vX.Y.Z to release. HACS shows the tag as the installed version, so it must match
# manifest.json (and const.py, which test_panel.py ties to it). Generated notes list the merged
# PRs; edit them on GitHub afterwards if they need more words.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the integration version
        run: |
          manifest="$(jq -r .version custom_components/jukeb/manifest.json)"
          if [ "${GITHUB_REF_NAME}" != "v${manifest}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${manifest}"
            exit 1
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
          fi
