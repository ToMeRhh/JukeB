<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" font-family="'Trebuchet MS', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="0.6" stop-color="#1d3461"/>
      <stop offset="1" stop-color="#1f6f9f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fe3ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7fe3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>

  <!-- faint grid, a nod to "build it yourself" -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 70 H1280 M0 140 H1280 M0 210 H1280 M0 280 H1280 M0 350 H1280"/>
    <path d="M80 0 V420 M160 0 V420 M240 0 V420 M320 0 V420 M400 0 V420 M480 0 V420 M560 0 V420 M640 0 V420 M720 0 V420 M800 0 V420 M880 0 V420 M960 0 V420 M1040 0 V420 M1120 0 V420 M1200 0 V420"/>
  </g>

  <!-- ===== text (left) ===== -->
  <text x="80" y="160" font-size="118" font-weight="bold" fill="#ffffff" letter-spacing="2">Juke<tspan fill="#ffbd55">B</tspan></text>
  <text x="84" y="226" font-size="40" font-weight="bold" fill="#ffe9c2">Tap a tag. Home Assistant plays it.</text>
  <text x="84" y="270" font-size="23" fill="#c9d6f0">RFID reader firmware and a Home Assistant integration.</text>
  <text x="84" y="300" font-size="23" fill="#c9d6f0">You decide what the device looks like.</text>

  <g font-size="20" font-weight="bold">
    <rect x="84" y="330" width="190" height="40" rx="20" fill="#18bcf2"/>
    <text x="179" y="357" text-anchor="middle" fill="#0b2140">Home Assistant</text>
    <rect x="288" y="330" width="96" height="40" rx="20" fill="#ffffff" opacity="0.92"/>
    <text x="336" y="357" text-anchor="middle" fill="#14213d">HACS</text>
    <rect x="398" y="330" width="168" height="40" rx="20" fill="#ffffff" opacity="0.92"/>
    <text x="482" y="357" text-anchor="middle" fill="#14213d">ESP32 + RC522</text>
    <rect x="580" y="330" width="122" height="40" rx="20" fill="#ffffff" opacity="0.92"/>
    <text x="641" y="357" text-anchor="middle" fill="#14213d">Local</text>
  </g>

  <!-- ===== flow (right): tag -> your device -> speaker ===== -->
  <g transform="translate(780 0)">
    <!-- tag card -->
    <g transform="translate(20 70) rotate(-12)">
      <rect width="120" height="76" rx="10" fill="#ffffff"/>
      <rect x="10" y="10" width="44" height="44" rx="6" fill="#ffbd55"/>
      <g fill="none" stroke="#1d3461" stroke-width="4" stroke-linecap="round">
        <path d="M74 26 a10 10 0 0 1 0 20"/>
        <path d="M84 18 a20 20 0 0 1 0 36"/>
        <path d="M94 10 a30 30 0 0 1 0 52"/>
      </g>
      <rect x="10" y="62" width="70" height="6" rx="3" fill="#c9d6f0"/>
    </g>

    <!-- your device: dashed outline around the reader board -->
    <ellipse cx="150" cy="250" rx="130" ry="70" fill="url(#glow)"/>
    <rect x="40" y="190" width="220" height="140" rx="22" fill="none" stroke="#ffbd55" stroke-width="4" stroke-dasharray="14 10"/>
    <text x="150" y="356" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffbd55">your enclosure</text>
    <!-- RC522 board -->
    <rect x="70" y="214" width="110" height="92" rx="6" fill="#1e5aa8"/>
    <rect x="80" y="224" width="90" height="62" rx="4" fill="none" stroke="#9cc3f5" stroke-width="3"/>
    <g fill="#d4af37"><circle cx="82" cy="298" r="3"/><circle cx="94" cy="298" r="3"/><circle cx="106" cy="298" r="3"/><circle cx="118" cy="298" r="3"/><circle cx="130" cy="298" r="3"/><circle cx="142" cy="298" r="3"/><circle cx="154" cy="298" r="3"/><circle cx="166" cy="298" r="3"/></g>
    <!-- ESP32 board -->
    <rect x="192" y="218" width="50" height="86" rx="5" fill="#2b2f36"/>
    <rect x="200" y="228" width="34" height="34" rx="2" fill="#b8c2cc"/>
    <circle cx="217" cy="286" r="4" fill="#5cf29a"/>

    <!-- tag to reader -->
    <path d="M110 160 q6 20 10 44" fill="none" stroke="#7fe3ff" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>

    <!-- Wi-Fi hop to the speaker -->
    <path d="M262 220 q70 -90 150 -10" fill="none" stroke="#7fe3ff" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>
    <text x="335" y="148" text-anchor="middle" font-size="16" fill="#9fd8f5">Home Assistant</text>

    <!-- speaker -->
    <ellipse cx="420" cy="350" rx="50" ry="10" fill="#000" opacity="0.25"/>
    <path d="M374 290 a46 16 0 0 1 92 0 v40 a46 16 0 0 1 -92 0 z" fill="#e9e6f5"/>
    <ellipse cx="420" cy="290" rx="46" ry="16" fill="#ffffff"/>
    <g fill="#9b93c4"><circle cx="404" cy="290" r="3"/><circle cx="416" cy="290" r="3"/><circle cx="428" cy="290" r="3"/><circle cx="440" cy="290" r="3"/></g>

    <!-- notes -->
    <g fill="#ffffff">
      <g transform="translate(430 190) rotate(10)">
        <ellipse cx="0" cy="40" rx="12" ry="9"/>
        <rect x="8" y="0" width="5" height="40"/>
        <path d="M13 0 q18 6 14 24 q-4 -12 -14 -12 z"/>
      </g>
    </g>
  </g>
</svg>
