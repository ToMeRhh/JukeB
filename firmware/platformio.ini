[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DJUKEB_VERSION=\"2.2.0\"
lib_deps =
  https://github.com/OSSLibraries/Arduino_MFRC522v2.git
  bblanchon/ArduinoJson@^7.4

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=gnu++17 -DNATIVE_TEST -DJUKEB_VERSION=\"2.2.0\"
lib_deps = bblanchon/ArduinoJson@^7.4
build_src_filter = +<PresenceDebouncer.cpp> +<EventPayload.cpp> +<ReplyParser.cpp>
